name: Daily Automated Tech Blog Dispatch

on:
  schedule:
    # 01:00 UTC = 08:00 WIB (Pagi)
    - cron: '0 1 * * *'
    # 11:00 UTC = 18:00 WIB (Sore)
    - cron: '0 11 * * *'
  workflow_dispatch: # Memungkinkan jalankan manual kapan saja dari tab Actions

jobs:
  publish-blog:
    name: Generate & Publish Tech Article
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Auto Blog Generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-blog.js

      - name: Commit and Push New Article
        run: |
          if [ -n "$(git status --porcelain src/data/blogs.json)" ]; then
            git config --local user.name "github-actions[bot]"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/blogs.json
            git commit -m "chore(blog): auto publish daily tech news [skip ci]"
            git push origin main
            echo "New article committed and pushed successfully!"
          else
            echo "No new article generated in this run. Everything is up to date."
          fi
